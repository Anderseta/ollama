name: Bug report
labels: [bug]
description: Report a reproducible problem with WildLlama.
body:
  - type: textarea
    id: description
    attributes:
      label: What is the issue?
      description: What happened? What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Include relevant logs and configured memory/runtime options. Remove tokens, private prompts and sensitive paths. See the [troubleshooting reference](https://github.com/Anderseta/wildllama/blob/main/docs/troubleshooting.mdx).
      render: shell
    validations:
      required: false
  - type: dropdown
    id: os
    attributes:
      label: OS
      description: Which operating system are you using?
      multiple: true
      options:
        - Linux
        - macOS
        - Windows
        - Docker
        - WSL2
    validations:
      required: false
  - type: dropdown
    id: gpu
    attributes:
      label: GPU
      description: Which GPU are you using?
      multiple: true
      options:
        - Nvidia
        - AMD
        - Intel
        - Apple
        - Other
    validations:
      required: false
  - type: dropdown
    id: cpu
    attributes:
      label: CPU
      description: Which CPU are you using?
      multiple: true
      options:
        - Intel
        - AMD
        - Apple
        - Other
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: WildLlama commit or build version
      description: Include `git rev-parse --short HEAD` for a source build and the output of `ollama --version`. Note whether the same problem occurs on upstream Ollama.
      placeholder: e.g., 4124b173 (source build)
    validations:
      required: false
